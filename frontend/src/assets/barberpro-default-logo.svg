<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="BarberPro IA Dreams">
  <defs>
    <radialGradient id="softGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2a2d34"/>
      <stop offset="100%" stop-color="#17191f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ffffff" flood-opacity="0.11"/>
    </filter>
  </defs>
  <rect width="720" height="360" rx="42" fill="#050506"/>
  <rect width="720" height="360" rx="42" fill="url(#softGlow)"/>
  <g transform="translate(0 10)" filter="url(#shadow)">
    <rect x="312" y="44" width="96" height="96" rx="22" fill="url(#markBg)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="360" y="99" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="60" font-weight="800">B</text>
    <text x="360" y="217" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">BarberPro</text>
    <text x="360" y="266" text-anchor="middle" fill="#ffffff" fill-opacity="0.86" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="14">IA DREAMS</text>
  </g>
</svg>



